name: Crear APK Spark Go HUD

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Instalar Java JDK 17 para Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 4. Preparar archivos web desde la carpeta www
        run: |
          mkdir -p app/src/main/assets
          cp www/index.html app/src/main/assets/
          if [ -f "www/spark_rojo.png" ]; then cp www/spark_rojo.png app/src/main/assets/; fi

      - name: 5. Compilar el APK con Capacitor / Gradle
        run: |
          npm install
          npx cap init SparkHUD com.andresdiaz.sparkhud --web-dir www
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 6. Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Spark-Go-HUD-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
